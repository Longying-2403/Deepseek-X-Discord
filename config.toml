# DeepSeek Buddy — configuration file
# Default values for every setting. Restart after editing for changes to take effect.
# Settings that server admins change in Discord with /ds override these defaults (they're stored in the database).

[deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"          # V4.1 Flash
timeout_seconds = 90
max_retries = 2                   # automatic retries on 429 / 5xx
# Web search goes through DeepSeek's Anthropic-compatible API (built-in web_search); empty = base_url + /anthropic
search_base_url = ""
search_timeout_seconds = 60
search_max_uses = 3               # max rounds of searching within one search

[bot]
timezone = "Asia/Taipei"          # the daily budget counts calendar days in this time zone; chat-log timestamps use it too
database = "data/dsbot.sqlite3"
sync_commands_on_start = true     # register the slash commands on startup
log_level = "INFO"
tick_seconds = 5                  # how often to check whether any channel should run a proactive check

[pricing]
# USD per million tokens, at peak prices; off-peak is multiplied by offpeak_factor automatically.
# Update these when DeepSeek changes its prices: https://api-docs.deepseek.com/quick_start/pricing
cache_hit = 0.006
cache_miss = 0.30
output = 1.20
offpeak_factor = 0.5
peak_hours_utc = [[1, 4], [6, 10]]  # Monday to Friday, UTC

[defaults]
# —— Server admins can change these in Discord with /ds ——
enabled = true                    # areas where it may respond. false = silent on every server by default, responding only where /ds area allows it (allowlist)
proactive = false                 # proactive chat is off by default; turn it on in the channels that want it with /ds proactive
refill_turns = 15                 # each time other people take 15 turns, 1 proactive message is added back to the quota
quota_capacity = 3                # the quota holds at most 3 (in a lively chat it can jump in at most 3 times in a row)
min_speak_gap = 120               # at least 120 seconds between two of its messages
quiet_seconds = 30                # 30 seconds with nobody talking or typing counts as a lull
max_wait_seconds = 180            # if the chat never goes quiet, it checks anyway after at most 180 seconds
mention_rate_limit = 3            # each person can call it at most 3 times per minute
aliases = ""                      # aliases, comma-separated; they also count as calling it when they appear in a message, e.g. "DS,Dee"
persona = ""                      # empty = default persona; best changed in Discord with /ds persona
share_memory = false              # cross-channel memory, off by default; turn it on with /ds share-memory (private channels must turn it on themselves to share out)

# —— Only you can change these (here, or with /dsowner in the CONTROL_GUILD_ID server) ——
min_eval_interval = 60            # at least 60 seconds between two proactive checks
proactive_thinking = "low"        # thinking level for proactive checks: off / low / high
mention_thinking = "off"          # thinking level when it's called: off is fastest
daily_budget_usd = 1.0            # max USD per server per day; over it, it only answers mentions; over 2x, not even those
global_daily_budget_usd = 3.0     # cap for all servers combined
context_budget_tokens = 30000     # once the context goes over this many tokens, the oldest half is compacted into a summary (max 200000)
vision = true                     # send images from the chat to the model
files = true                      # read files people upload (text, code, PDF, Word, Excel, PowerPoint)
web_search = true                 # when it's called and needs current information, search the web (DeepSeek's built-in search)
daily_search_limit = 30           # max searches per server per day (0 = no searching)

[engine]
# Usually no need to touch these
max_batch_messages = 40           # max new messages per round
max_pending_messages = 120        # max messages buffered while waiting for a round
pending_max_age_seconds = 21600   # buffered messages older than 6 hours are dropped
max_chars_per_message = 1200      # each message is cut to this many characters before it goes into the context
max_images_per_round = 4
image_max_side = 1024             # images in the message that calls it
low_detail_max_side = 512         # other images (the model only looks at them at 512×512 anyway)
file_max_bytes = 20000000         # files over 20 MB aren't read
file_max_chars = 20000            # at most 20,000 characters per file (only the beginning of longer files)
file_round_max_chars = 40000      # at most 40,000 characters from all files combined in one round
max_files_per_round = 3
file_timeout_seconds = 30         # wait at most 30 seconds for one file to be parsed
turn_merge_seconds = 20           # messages from the same person within 20 seconds count as one turn
react_cost = 0.3                  # quota used by a reaction alone
typing_chars_per_second = 3.0     # "typing" speed
typing_min_seconds = 2.0
typing_max_seconds = 10.0
max_output_tokens = 2000
max_thinking_tokens = 6000
hard_stop_multiplier = 2.0
summary_max_chars = 1500          # max length of the memory summary (600 in the Chinese version; English needs more characters for the same content)
max_searches_per_round = 2        # max searches in a round where it's called
search_max_chars = 2000           # max characters of one search result
share_recent_hours = 6            # if the same person talked with it in another channel within this many hours, bring those lines along
recall_max_chars = 3000           # max characters when looking through another channel's history
share_list_limit = 30             # max channels listed when telling it which channels it can look through
