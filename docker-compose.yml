services:
  dsbot:
    build: .
    container_name: dsbot
    restart: unless-stopped
    stop_grace_period: 30s                  # give it time to finish sending the messages it's in the middle of
    env_file: .env
    volumes:
      - ./config.toml:/app/config.toml:ro   # config changes don't need a rebuild, just a restart
      - ./data:/app/data                    # database: chat history, settings, spending
