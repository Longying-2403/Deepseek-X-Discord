services:
  dsbot:
    build: .
    container_name: dsbot
    restart: unless-stopped
    stop_grace_period: 45s                  # 给它时间把正在发的消息发完、离开语音频道
    env_file: .env
    volumes:
      - ./config.toml:/app/config.toml:ro   # 改配置不用重新构建：docker compose up -d --force-recreate
      - ./data:/app/data                    # 数据库：对话记录、设置、花费
    # 桌面操作（可选，见 README“十五”）：让电脑上的桌面小程序连到这个端口。要用就去掉下面两行前面的 #
    # ports:
    #   - "8765:8765"
